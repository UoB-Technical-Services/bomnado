{# The window's list of conversations. Context: `threads`. Clicking one is handled by ai_chat.js. #}
{% if threads %}
<ul class="list-unstyled mb-0">
    {% for thread in threads %}
    <li class="bomnado-ai-chat-threads-item">
        <a href="#" data-ai-thread="{{ thread.id }}" class="text-truncate">{{ thread.title|default:"(no title)" }}</a>
        <span class="text-muted small">{{ thread.updated|date:"j M H:i" }}</span>
        <button type="button" class="btn btn-sm btn-link text-danger py-0 px-1" title="Delete this conversation"
            hx-post="{% url 'bom:ai_chat_delete' thread.id %}" hx-target="#aiChatBody" hx-swap="innerHTML"
            hx-confirm="Delete this conversation?">&times;</button>
    </li>
    {% endfor %}
</ul>
{% else %}
<div class="text-muted small">No conversations yet.</div>
{% endif %}
