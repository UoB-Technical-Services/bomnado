{# A small line icon for an activity entry; `icon` is one of edit, add, remove, feedback, resolved, revert. #}
{# Stroked in the current text colour, so it reads as part of the sentence in whatever grey the row uses. #}
<svg class="bomnado-activity-svg" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if icon == 'edit' %}<path d="M11 2.5l2.5 2.5L5 13.5H2.5V11z"/><path d="M9.5 4l2.5 2.5"/>
{% elif icon == 'add' %}<path d="M8 3v10M3 8h10"/>
{% elif icon == 'remove' %}<path d="M3 8h10"/>
{% elif icon == 'feedback' %}<path d="M2.5 3h11v7.5H7.5L4.5 13v-2.5h-2z"/>
{% elif icon == 'resolved' %}<path d="M3 8.5l3 3 7-7"/>
{% elif icon == 'revert' %}<path d="M6 4L3 7l3 3"/><path d="M3 7h6.5a3.25 3.25 0 0 1 0 6.5H7"/>
{% endif %}
</svg>
