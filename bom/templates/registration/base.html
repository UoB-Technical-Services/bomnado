{% load static %}
{# The pages outside the app: signing in, resetting a password, and the error pages. The same top bar, one card. #}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="{% static 'lib/bootstrap-4.3.1/bootstrap.min.css' %}" />
    <link rel="stylesheet" href="{% static 'app/theme.css' %}" type="text/css" media="all" />
    <link rel="icon" href="{% static 'assets/favicon.svg' %}" type="image/x-icon" />
    {% block title %}<title>Bomnado</title>{% endblock %}
</head>
<body>
    <header class="app-topbar">
        <a class="bn-brand" href="{% url "bom:start" %}"><img src="{% static 'assets/logo.svg' %}" alt="Bomnado" /></a>
    </header>
    <main class="bn-auth">
        <div class="bn-auth-card">
            {% block body %}{% endblock %}
        </div>
    </main>
    <footer class="bn-auth-footer">Made with care by HE Inventions</footer>
</body>
</html>
