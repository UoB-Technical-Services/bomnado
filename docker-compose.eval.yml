x-bomnado-image: &bomnado-image
  image: bomnado
  build: .

services:
  django:
    << : *bomnado-image
    restart: always
    environment:
      - DJANGO_SETTINGS_MODULE=bomnado.settings.development
    command: bash /code/quick-launch.sh
    # TODO currently we can't save the user database this way. Maybe that's fine for now? They could still export it from the image
    ports:
      - "8000:8000"
