[project]
name = "bomnado"
version = "0.19.0"
description = "Bomnado Django application"
requires-python = "~=3.12.0"
dependencies = [
  "authlib>=1.6.4",
  "django>=5.2.0,<5.3",
  "djangorestframework>=3.14.0,<4.0",
  "python-dotenv>=1.1.1",
  "martor==1.5.1",
  "markdown>=3.4.0,<4.0",
  "pillow>=10.0.0,<11.0",
  "beautifulsoup4==4.11.2",
  "requests>=2.25.0,<3.0",
  "urllib3>=2.0.0,<3.0",
  "django-widget-tweaks==1.4.8",
  "html5lib>=1.1,<2.0",
  "xlsxwriter==1.3.3",
  "django-cleanup<8.0,>=7.0",
  "gunicorn>=23.0.0",
  "psycopg2-binary==2.9.10",
  "sentry-sdk>=0.20.3,<2.0",
  "marko==1.1.0",
  # Upgrade celery to 5.x because 4.4.x wheels have invalid metadata PDM rejects
  "celery==5.5.3",
  "django-redis==5.0.0",
  "redis>=4.0.0,<5.0",
  "django-celery-results==2.4.0",
  "django-dbbackup>=4.1.0",
  "dropbox~=11.36.0",
  "django-storages==1.12.3",
  "python-dotenv>=1.1.1",
  "whitenoise>=6.11.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: Django",
]

 [project.optional-dependencies]
 dev = [
     "factory-boy==3.0.1",
     "coverage==5.2.1",
     "flake8>=7.3.0",
     "django-extensions>=3.1.5",
     "pygments>=2.19.2",
 ]

 [build-system]
 requires = ["pdm-backend"]
 build-backend = "pdm.backend"

 [tool.pdm]
 package-dir = {"" = "."}

 [tool.pdm.scripts]
 start = "python manage.py runserver"
 migrate = "python manage.py migrate"
 manage = "python manage.py"
 test = "python manage.py test"
 lint = "flake8 ."

 [tool.coverage.run]
 source = ["bom", "bomnado", "general"]
